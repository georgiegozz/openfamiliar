# Manual SignPath Windows signing workflow.
#
# This file is inert until a maintainer sets the repository variable
# SIGNPATH_ENABLED=true and the SignPath variables listed in docs/signing.md,
# plus the SIGNPATH_API_TOKEN secret. It does not run on push or pull_request.
# Adding or changing a workflow requires Jorge's explicit authorization
# before merge.
#
# Do not put API tokens or other secrets in this file.

name: signpath-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skipped-notice:
    if: >-
      ${{
        vars.SIGNPATH_ENABLED != 'true'
        || vars.SIGNPATH_ORGANIZATION_ID == ''
        || vars.SIGNPATH_PROJECT_SLUG == ''
        || vars.SIGNPATH_SIGNING_POLICY_SLUG == ''
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Signing is not enabled
        run: |
          echo "This workflow is inert."
          echo "It does not build, upload, or submit a SignPath signing request."
          echo "To enable it after SignPath Foundation acceptance, follow docs/signing.md:"
          echo "  1. Set repository variable SIGNPATH_ENABLED=true"
          echo "  2. Set SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, and SIGNPATH_SIGNING_POLICY_SLUG"
          echo "  3. Add repository secret SIGNPATH_API_TOKEN (never commit it)"
          echo "OpenFamiliar does not claim that current binaries are signed."

  preflight:
    if: >-
      ${{
        vars.SIGNPATH_ENABLED == 'true'
        && vars.SIGNPATH_ORGANIZATION_ID != ''
        && vars.SIGNPATH_PROJECT_SLUG != ''
        && vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm the API token is configured
        env:
          TOKEN_PRESENT: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "SIGNPATH_ENABLED is true, but SIGNPATH_API_TOKEN is not set."
            echo "No build or signing request will be started. See docs/signing.md."
            exit 1
          fi
          echo "SignPath variables and the API token are present. The signing job may run."

  sign:
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15)
        with:
          toolchain: stable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Windows installers
        run: pnpm --filter @openfamiliar/desktop tauri build

      - name: Hash unsigned installers
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle -Recurse -File -Include *.msi,*.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash, $_.Path } |
            Set-Content -Encoding utf8 target/release/bundle/SHA256SUMS.txt

      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openfamiliar-windows-unsigned-${{ github.sha }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error

      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openfamiliar-windows-signed-${{ github.sha }}
          path: signed
          if-no-files-found: error
