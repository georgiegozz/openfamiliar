[package]
name = "openfamiliar-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "OpenFamiliar Desktop (Tauri)"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
# 2.12.0 is the newest plugin that still declares rust-version 1.77.2 and
# depends on tauri ^2.10. 2.13.0+ requires Rust 1.90 and tauri ^2.12.
# Default `zip` is off: MSI/NSIS updates do not need it, and zip 4 would
# reintroduce an older zip crate than the 9.7.3 line already in the workspace.
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
directories = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
familiar-cli = { path = "../../../tools/familiar-cli" }
familiar-credentials = { path = "../../../crates/familiar-credentials" }
familiar-anthropic = { path = "../../../crates/familiar-anthropic", features = ["http"] }
base64 = "=0.22.1"

[lib]
name = "openfamiliar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = { workspace = true }
