# cargo-deny policy for OpenFamiliar.
# License allow list is the SPDX identifiers actually present in the reviewed
# inventory at docs/legal/dependency-licenses.json (atomic licenses; OR
# expressions are accepted when any alternative is listed). Unused licenses are
# omitted so cargo-deny can warn if this file drifts.
#
# Advisories are also checked, but known IDs are not ignored here. CI compares
# cargo-deny and cargo-audit output to scripts/ci/advisory-baseline.json so
# current findings stay visible and only new, expired, or stale entries fail
# the job. That grace policy is a maintainer decision.

[graph]
all-features = false
exclude-dev = false

[advisories]
# Informational "unmaintained" findings are limited to workspace crates.
# cargo-deny 0.20 treats unsound used-graph findings as errors; those IDs go
# through the advisory baseline rather than an ignore list.
unmaintained = "workspace"
yanked = "warn"
unused-ignored-advisory = "warn"

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
    "0BSD",
    "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
